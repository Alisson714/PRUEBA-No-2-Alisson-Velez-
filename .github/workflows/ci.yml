name: CI/CD Pipeline - Lopez

on:
  push:
    branches: ["lopez"]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: lopez
  IMAGE_TAG: 1.0.5

jobs:
  test:
    name: 🧪 Run Tests
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🐍 Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: 📦 Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: ✅ Run tests with pytest
      run: |
        pytest test_calculator.py -v --tb=short
        echo "✅ All tests passed!"

  build:
    name: 🏗️ Build and Push
    needs: test
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🔐 Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: 📝 Set lowercase repository owner
      run: |
        echo "REPO_OWNER_LOWER=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

    - name: 🏗️ Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        tags: ${{ env.REGISTRY }}/${{ env.REPO_OWNER_LOWER }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

  deploy:
    name: 🚀 Deploy to VPS
    needs: build
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 📤 Copy stack.yml to VPS
      uses: appleboy/scp-action@v1
      with:
        host: 161.97.140.245
        username: ${{ secrets.VPS_USER }}
        password: ${{ secrets.VPS_PASSWORD }}
        port: 1004
        source: "stack.yml"
        target: "/home/${{ secrets.VPS_USER }}/automatizar"

    - name: 🚀 Deploy services on VPS
      uses: appleboy/ssh-action@v1
      with:
        host: 161.97.140.245
        username: ${{ secrets.VPS_USER }}
        password: ${{ secrets.VPS_PASSWORD }}
        port: 1004
        script: |
          echo "🔐 Logging in to GHCR..."
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.repository_owner }} --password-stdin

          # Preparar nombre de imagen en minúsculas
          IMAGE_NAME_LOWER=$(echo "${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          export IMAGE_NAME="$IMAGE_NAME_LOWER:${{ env.IMAGE_TAG }}"

          echo "📥 Pulling latest image: $IMAGE_NAME"
          docker pull "$IMAGE_NAME"

          # Crear red swarm si no existe
          echo "🌐 Creating swarm network 'web' if not exists..."
          docker network ls | grep -q web || docker network create --driver overlay web

          echo "🗑️ Removing old stack..."
          docker stack rm lopez || true

          echo "⏳ Waiting for cleanup..."
          sleep 20

          echo "🚀 Deploying new stack..."
          cd ~/automatizar
          docker stack deploy --with-registry-auth -c stack.yml lopez

          echo "⏳ Waiting for services to start..."
          sleep 10

          echo "✅ Deployment complete! Checking services..."
          docker service ls
          docker service ps lopez_lopez --no-trunc || echo "Service lopez_lopez not found, checking all lopez services..."
          docker service ps $(docker service ls --filter name=lopez -q) --no-trunc